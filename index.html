<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; background: #fff; }
    .markdown-body {
      max-width: 1012px;
      padding: 45px;
      margin: 0 auto;
      width: 100%;
    }
    #loading, #error {
      display: none;
      text-align: center;
      padding: 60px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: #656d76;
    }
    #loading { display: block; }
    #loading::before {
      content: '';
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid #d0d7de;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { color: #cf222e; }

    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; }
      #loading { color: #8b949e; }
      #loading::before {
        border-color: #30363d;
        border-top-color: #58a6ff;
      }
      #error { color: #f85149; }
    }
  </style>
</head>
<body>
  <div id="loading">Loading markdown...</div>
  <div id="error"></div>
  <div id="content" class="markdown-body"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
  </script>
  <script>
    const content = document.getElementById('content');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');

    const mdFile = new URLSearchParams(window.location.search).get('file') || 'example.md';

    fetch(mdFile)
      .then(res => {
        if (!res.ok) throw new Error(`Failed to load ${mdFile} (HTTP ${res.status})`);
        return res.text();
      })
      .then(raw => {
        const html = marked.parse(raw, { gfm: true, breaks: true });
        content.innerHTML = html;
        content.querySelectorAll('pre code').forEach(block => {
          hljs.highlightElement(block);
        });
        loading.style.display = 'none';
      })
      .catch(err => {
        loading.style.display = 'none';
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
      });
  </script>
</body>
</html>
