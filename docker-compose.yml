version: '3.8'

services:
  jekyll:
    image: jekyll/jekyll
    stdin_open: true # Equivalente a -i
    tty: true        # Equivalente a -t
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll
    command: >
      bash -c "bundle install && bundle exec jekyll serve --watch --force_polling --host 0.0.0.0"
